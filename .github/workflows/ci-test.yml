name: ci-test

# Fast checks for the Arsenal platform CLI: unit tests + shell linting.
# No ISO build here — build-iso.yml still proves the image builds and boots.

on:
  push:
    paths:
      - "cli/**"
      - "tools/**"
      - "build.sh"
      # the profile files ci-test lints (shellcheck + mandoc) — keep in sync
      # with the ShellCheck / man-page-lint steps below so a change to any of
      # them actually re-runs its check
      - "profile/airootfs/usr/local/bin/**"
      - "profile/airootfs/etc/profile.d/**"
      - "profile/airootfs/usr/share/bash-completion/**"
      - "profile/airootfs/usr/share/man/**"
      - ".github/workflows/ci-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint (ruff)
        run: |
          python -m pip install --quiet "ruff==0.15.18"
          ruff check --config cli/pyproject.toml cli tools

      - name: Unit tests (stdlib unittest)
        run: |
          cd cli
          python -m unittest discover -s tests -t . -v

      - name: Provenance tool tests (SBOM generate + verify)
        run: |
          cd tools
          python -m unittest discover -s . -p "test_*.py" -v

      - name: CLI smoke
        run: |
          cd cli
          python -m arsenal_cli --version
          ARSENAL_NO_COLOR=1 python -m arsenal_cli doctor || true   # exit 1 off-Arsenal is fine
          # armory --json must parse and list weapons (exercises __main__ wiring)
          ARSENAL_REGISTRY="$GITHUB_WORKSPACE/profile/airootfs/usr/local/share/arsenal/registry" \
            python -m arsenal_cli armory --json \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['count']>0, d"

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S warning \
            profile/airootfs/usr/local/bin/arsenal \
            profile/airootfs/usr/local/bin/arsenal-selftest \
            profile/airootfs/etc/profile.d/zz-arsenal-selftest.sh \
            profile/airootfs/usr/share/bash-completion/completions/arsenal \
            tools/smoke-test.sh \
            tools/integration-test.sh \
            tools/verify-release.sh \
            build.sh
          # completion must source cleanly and register (catches runtime parse errors)
          bash -c "source profile/airootfs/usr/share/bash-completion/completions/arsenal \
            && complete -p arsenal | grep -q _arsenal"

      - name: Man page lint (mandoc)
        run: |
          sudo apt-get install -y --no-install-recommends mandoc
          mandoc -T lint -W warning profile/airootfs/usr/share/man/man1/arsenal.1
